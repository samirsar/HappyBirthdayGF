<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Why You're My Best Friend! 💖</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="./cause.css">
    <link rel="stylesheet" href="playlist.css">
    <link rel="stylesheet" href="butterflies.css">
</head>
<body>
    <img src="balloon.png" alt="" class="corner-balloon" aria-hidden="true">
    <div class="custom-cursor">
        <svg viewBox="0 0 24 24">
            <path fill="#ff69b4" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </div>

    <section class="hero-screen">
        <div class="container">
            <h1>Happy Birthday My Bubbu💖</h1>
        </div>
    </section>

    <section id="photo-reel" class="photo-reel" aria-label="Photo reel">
        <div class="reel-progress" id="reel-progress"></div>
        <div class="reel-track" id="reel-track"></div>
        <div class="reel-hint">Swipe up</div>
    </section>

    <section class="after-reel">
        <div class="container">
            <div id="reasons-container"></div>
            
            <button class="shuffle-button">Click Here... 💕</button>
            <div class="reason-counter"></div>

            <div class="ending-section">
                <div class="teddy-hug">
                    <img src="./d1.jpg" alt="Teddy Hug">
                </div>
                <div class="ending-text">You're the BESTEST ! 💖</div>
            </div>
        </div>
    </section>

    <aside id="playlist" class="playlist">
        <div class="playlist-header">
            <span>Playlist</span>
            <button type="button" id="playlist-toggle" class="playlist-toggle" aria-label="expand playlist" aria-expanded="false">▲</button>
        </div>
        <div id="track-list" class="track-list"></div>
        <div class="playlist-controls">
            <button id="prev-track" aria-label="previous">⟨</button>
            <button id="toggle-play" aria-label="play">Play</button>
            <button id="next-track" aria-label="next">⟩</button>
        </div>
    </aside>

    <script src="playlist.js"></script>
    <script src="butterflies.js"></script>
    <script src="cause.js"></script>
</body>
</html>
