<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Happy Birthday</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="playlist.css">
    <link rel="stylesheet" href="butterflies.css">
    
</head>
<body>
    <img src="balloon.png" alt="" class="corner-balloon" aria-hidden="true">
    <div class="cursor"></div>
    <div class="container">
        <h1>Happy Birthday Jenny💗</h1>
        <div class="greeting"></div>
        <button class="cta-button">Click to Enter Our World 💕</button>
    </div>

    <div id="countdown-overlay" class="overlay hidden">
        <video
            id="countdown-video"
            class="countdown-video"
            src="video/countdown-bg.mp4"
            muted
            loop
            playsinline
            autoplay
            preload="auto"
            aria-hidden="true"
        ></video>
        <video
            id="firecracker-video"
            class="countdown-video firecracker-video"
            src="video/firecracker.mp4"
            muted
            loop
            playsinline
            preload="auto"
            aria-hidden="true"
        ></video>
        <div class="countdown-video-shade"></div>
        <div class="letterbox top"></div>
        <div class="letterbox bottom"></div>
        <div class="film-grain"></div>
        <div class="vignette"></div>
        <canvas id="celebration-canvas"></canvas>
        <button id="unmute" class="mutebtn" aria-label="toggle sound">🔈</button>
        <div class="countdown-content">
            <h2>Jenny</h2>
            <div id="timer" class="big-timer">
                <span id="days">00</span>
                <span class="sep">:</span>
                <span id="hours">00</span>
                <span class="sep">:</span>
                <span id="minutes">00</span>
                <span class="sep">:</span>
                <span id="seconds">00</span>
            </div>
            <div class="subtext">There is suprise bubbu. Tab tak gaana suno</div>
        </div>
    </div>
    
    <!-- Playlist -->
    <aside id="playlist" class="playlist">
        <div class="playlist-header">
            <span>Playlist</span>
            <button type="button" id="playlist-toggle" class="playlist-toggle" aria-label="expand playlist" aria-expanded="false">▲</button>
        </div>
        <div id="track-list" class="track-list">
            <div class="empty">No tracks yet — add your songs in <code>script.js</code></div>
        </div>
        <div class="playlist-controls">
            <button id="prev-track" aria-label="previous">⟨</button>
            <button id="toggle-play" aria-label="play">Play</button>
            <button id="next-track" aria-label="next">⟩</button>
        </div>
    </aside>

    <script src="playlist.js"></script>
    <script src="butterflies.js"></script>
    <script src="script.js"></script>
</body>
</html>
